<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="hdr-row">
      <h1>WeMD <span class="ver">v<span id="ver"></span></span></h1>
      <div class="lang-switch">
        <button id="lang-en" class="langbtn active">EN</button>
        <button id="lang-zh" class="langbtn">中文</button>
      </div>
    </div>
    <div id="title" class="title"></div>
    <div id="url" class="url"></div>
    <div class="hdr-links">
      <a href="https://github.com/stwhwing/wemd-extension" target="_blank" data-i18n="gh_link">GitHub</a>
      <span>·</span>
      <a href="https://wemd.zyx.pink/" target="_blank" data-i18n="site_link">Website</a>
    </div>
  </header>

  <div id="probar" class="probar hidden">
    <span id="probadge" class="probadge hidden">PRO</span>
    <span id="protext" class="protext"></span>
    <button id="probtn" class="probtn hidden" data-i18n="pro_activate">Activate Pro</button>
  </div>
  <div id="proform" class="proform hidden">
    <input id="prokey" class="proinput" data-i18n-ph="pro_key_ph" placeholder="License key (WEMD-XXXXX-…)">
    <input id="proemail" class="proinput" data-i18n-ph="pro_email_ph" placeholder="Purchase email">
    <div class="btns"><button id="prosubmit" class="btns-b" data-i18n="pro_activate_btn">Activate</button><button id="procancel" class="btns-b ghost" data-i18n="cancel">Cancel</button></div>
    <div id="promsg" class="promsg hidden"></div>
  </div>

  <div id="status" class="status"></div>

  <label class="sel-only"><input type="checkbox" id="sel-only" /> <span data-i18n="selection_only">Convert selection only</span></label>

  <div id="stats" class="stats hidden">
    <div class="stat-row">
      <span><span data-i18n="raw_label">Original</span> ≈ <b id="raw-tok"></b> tok</span>
      <span>Markdown ≈ <b id="md-tok"></b> tok</span>
    </div>
    <div class="saved"><span data-i18n="saved_label">Saved</span> ≈ <b id="saved-tok"></b> tok（<span id="saved-pct"></span>%）</div>
    <div class="basis" id="basis"></div>
    <div class="est" data-i18n="basis_note">chars/4 heuristic, CJK-biased</div>
  </div>

  <pre id="preview" class="preview hidden"></pre>

  <div class="btns">
    <button id="copy" class="hidden" data-i18n="copy_btn">Copy Markdown</button>
    <button id="download" class="hidden" data-i18n="download_btn">Download .md</button>
    <button id="reconvert" class="hidden" data-i18n="reconvert_btn">Re-convert</button>
    <button id="batch" class="hidden" data-i18n="batch_btn">Batch convert all tabs (Pro)</button>
  </div>
  <div id="batchstatus" class="promsg hidden"></div>

  <div id="airow" class="airow hidden">
    <span id="ailabel-cn" class="ailabel"></span>
    <button id="ai-deepseek" class="aibtn">DeepSeek</button>
    <button id="ai-kimi" class="aibtn">Kimi</button>
    <button id="ai-doubao" class="aibtn">豆包</button>
    <button id="ai-yuanbao" class="aibtn">元宝</button>
  </div>
  <div id="airow2" class="airow hidden">
    <span id="ailabel-gl" class="ailabel"></span>
    <button id="ai-chatgpt" class="aibtn" title="requires proxy in CN">ChatGPT 🌐</button>
    <button id="ai-claude" class="aibtn" title="requires proxy in CN">Claude 🌐</button>
    <button id="ai-gemini" class="aibtn" title="requires proxy in CN">Gemini 🌐</button>
    <button id="ai-perplexity" class="aibtn" title="requires proxy in CN">Perplexity 🌐</button>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
